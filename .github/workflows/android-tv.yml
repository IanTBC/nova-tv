name: Android TV build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-tv.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Bundle the app UI
        run: |
          mkdir -p android/app/src/main/assets
          cp -r src/app android/app/src/main/assets/app
      - name: Build APK
        working-directory: android
        run: |
          export NOVA_VN=$(jq -r .version release.json) NOVA_VC=$(jq -r .code release.json)
          gradle --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/
      - name: Collect
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/*.apk out/
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp $BT/lib/apksigner.jar out/
      - name: Push build to the android-build branch
        run: |
          cd out
          git init -q -b android-build
          git config user.name "Nova TV build"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-build
