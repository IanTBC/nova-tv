<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nova TV mini player</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="mini">
  <div class="mini-root paused" id="root">
    <video id="v" playsinline></video>
    <div class="mini-load" id="load"><div class="spinner"></div></div>
    <div class="mini-ui">
      <div class="mini-top">
        <b id="title"></b>
        <button id="expand" title="Back to full player" aria-label="Back to full player"><i data-icon="expand"></i></button>
        <button id="close" title="Close" aria-label="Close mini player"><i data-icon="x"></i></button>
      </div>
      <div class="mini-mid"><button id="toggle" aria-label="Play or pause"><i data-icon="pause" id="tIcon"></i></button></div>
      <div id="bottom"><span class="chip live mini-live hidden" id="liveTag">LIVE</span><div class="mini-bar hidden" id="bar"><b id="fill"></b></div></div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>
  <script src="vendor/hls.min.js"></script>
  <script src="vendor/mpegts.js"></script>
  <script src="js/core.js"></script>
  <script src="js/mini.js"></script>
</body>
</html>
